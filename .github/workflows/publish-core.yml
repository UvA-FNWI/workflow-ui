name: Publish @uva-fnwi/datanose-core

on:
    push:
        branches:
            - main
        paths:
            - "packages/core/package.json"

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm and Node
              uses: pnpm/setup@v2.1.0
              with:
                  version: 12.2.1
                  runtime: node@24.20.0
                  install: false

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter @uva-fnwi/datanose-core test

            - run: pnpm --filter @uva-fnwi/datanose-core publish --no-git-checks
