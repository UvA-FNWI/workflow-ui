name: Publish @uva-fnwi/datanose-core

on:
    push:
        branches:
            - main
        paths:
            - "packages/core/package.json"

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.25.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter @uva-fnwi/datanose-core test

            - run: pnpm --filter @uva-fnwi/datanose-core publish --no-git-checks
