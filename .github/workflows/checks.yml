name: Check for smells
on:
    pull_request:
        branches: ["main"]

jobs:
    setup:
        runs-on: self-hosted
        name: Setup dependencies
        strategy:
            matrix:
                node-version: [20]
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install

    format:
        name: Format check
        runs-on: self-hosted
        needs: setup
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Prettier
              run: pnpm run format:check

    lint:
        name: Lint check
        runs-on: self-hosted
        needs: setup
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Lint
              run: pnpm run lint

    translations:
        name: Translations check
        runs-on: self-hosted
        needs: setup
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Translations
              run: pnpm run translations:check
