name: Check for smells
on:
    pull_request:
        branches: [ "main" ]

jobs:
    check-all:
        name: Lint & Format checks
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10
                run_install: true
            # - name: Cache dependencies
            #   id: cache
            #   uses: actions/cache@v4
            #   with:
            #     path: node_modules
            #     key: modules-${{ hashFiles('pnpm-lock.yaml') }}

            # - name: Run containers
            # #   if: steps.cache.outputs.cache-hit != 'true'
            #   run: pnpm install
            - name: Prettier
              run: pnpm run format:check
            - name: Lint
              if: always()
              run: pnpm run lint
