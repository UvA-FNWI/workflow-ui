name: Check for smells
on:
    pull_request:
        branches: ["main"]

jobs:
    check-all:
        name: Lint & Format checks
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
            - name: Setup pnpm and Node
              uses: pnpm/setup@v2.1.0
              with:
                  version: 12.2.1
                  runtime: node@24.20.0
                  cache: true
                  install: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Prettier
              run: pnpm run format:check
            - name: Lint
              if: always()
              run: pnpm run lint
            - name: Translations
              if: always()
              run: pnpm run translations:check
            - name: Test
              if: always()
              run: pnpm -r test
