name: Check for smells
on:
    pull_request:
        branches: ["main"]

jobs:
    check-all:
        name: Lint & Format checks
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Setup pnpm and Node
              uses: pnpm/setup@v2.1.0
              with:
                  version: 12.2.1
                  runtime: node@24.20.0
                  cache: true
                  require-lockfile: true
            - name: Forbid nested package-manager files
              run: |
                  set -euo pipefail
                  nested=$(find packages -maxdepth 2 \( \
                    -name pnpm-lock.yaml -o \
                    -name pnpm-workspace.yaml -o \
                    -name package-lock.json -o \
                    -name yarn.lock \
                  \) -print)
                  if [ -n "${nested}" ]; then
                    echo "Nested package-manager files are not allowed:"
                    echo "${nested}"
                    echo "Install from the repository root with pnpm."
                    exit 1
                  fi
            - name: Prettier
              run: pnpm run format:check
            - name: Lint
              if: always()
              run: pnpm run lint
            - name: Translations
              if: always()
              run: pnpm run translations:check
            - name: Test
              if: always()
              run: pnpm -r test
