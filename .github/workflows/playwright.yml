name: End-to-end tests
on:
    pull_request:
        branches: [main]
jobs:
    test:
        timeout-minutes: 60
        runs-on: self-hosted
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Playwright tests
              run: |
                  set -euxo pipefail
                  docker build -f tests/Dockerfile -t "datanosecr.azurecr.io/workflow-tests:latest" .
                  docker run datanosecr.azurecr.io/workflow-tests:latest
