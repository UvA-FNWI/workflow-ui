name: End-to-end tests
on:
    pull_request:
        branches: [main]
        paths:
            - src/**
            - public/**
            - tests/**
            - packages/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - Dockerfile
            - tests/Dockerfile
            - playwright.config.ts
            - vite.config.ts
            - tsconfig.json
            - tsconfig.app.json
            - .github/workflows/playwright.yml
jobs:
    test:
        timeout-minutes: 60
        runs-on: self-hosted
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Playwright tests
              run: |
                  set -euxo pipefail
                  docker build -f tests/Dockerfile -t "datanosecr.azurecr.io/workflow-tests:latest" .
                  docker run datanosecr.azurecr.io/workflow-tests:latest
