name: Publish @uva-fnwi/datanose-ui

on:
    push:
        branches:
            - main
        paths:
            - "packages/ui/package.json"

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter @uva-fnwi/datanose-ui build

            - run: pnpm --filter @uva-fnwi/datanose-ui test

            - run: pnpm --filter @uva-fnwi/datanose-ui publish --no-git-checks
