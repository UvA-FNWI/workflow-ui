name: Publish @uva-fnwi/datanose-ui

on:
    push:
        branches:
            - main
        paths:
            - "packages/ui/package.json"

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Setup pnpm and Node
              uses: pnpm/setup@v2.1.0
              with:
                  version: 12.2.1
                  runtime: node@24.20.0
                  require-lockfile: true

            - run: pnpm --filter @uva-fnwi/datanose-ui build

            - run: pnpm --filter @uva-fnwi/datanose-ui test

            - run: pnpm --filter @uva-fnwi/datanose-ui publish --no-git-checks
