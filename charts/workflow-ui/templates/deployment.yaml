apiVersion: apps/v1
kind: Deployment
metadata:
    name: workflow-ui
    namespace: "{{ .Release.Namespace }}"
spec:
    selector:
        matchLabels:
            app: workflow-ui
    replicas: 1
    revisionHistoryLimit: 3
    template:
        metadata:
            labels:
                app: workflow-ui
        spec:
            containers:
                - name: workflow-ui
                  image: "{{ .Values.image }}:{{ .Values.tag }}"
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80
                  env:
                      - name: WORKFLOW_UI_VERSION
                        value: "{{ .Chart.AppVersion }}"
                  volumeMounts:
                      - name: env-file
                        mountPath: /usr/share/nginx/html/environment.js
                        subPath: env-contents
                        readOnly: true
                      {{- if .Values.azure }}
                      - name: secrets-store-inline
                        mountPath: "/etc/secrets"
                        readOnly: true
                      {{- end }}
            volumes:
                - name: env-file
                  configMap:
                      name: workflow-ui-configmap
                {{- if .Values.azure }}
                - name: secrets-store-inline
                  csi:
                      driver: secrets-store.csi.k8s.io
                      readOnly: true
                      volumeAttributes:
                          secretProviderClass: "workflow-ui-secretproviderclass"
                {{- end }}
