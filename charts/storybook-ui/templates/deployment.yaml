apiVersion: apps/v1
kind: Deployment
metadata:
    name: storybook-ui
    namespace: "{{ .Release.Namespace }}"
spec:
    selector:
        matchLabels:
            app: storybook-ui
    replicas: 1
    revisionHistoryLimit: 3
    template:
        metadata:
            labels:
                app: storybook-ui
        spec:
            containers:
                - name: storybook-ui
                  image: "{{ .Values.image }}:{{ .Values.tag }}"
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80
                  env:
                      - name: UI_VERSION
                        value: "{{ .Chart.AppVersion }}"
